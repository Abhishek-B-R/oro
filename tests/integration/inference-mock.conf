server {
    listen 443 ssl;
    ssl_certificate /tmp/mock.crt;
    ssl_certificate_key /tmp/mock.key;

    location = /v1/public/inference/models {
        default_type application/json;
        return 200 '{"models":["test/model","mistralai/mistral-small-2603"]}';
    }

    location = /api/v1/chat/completions {
        if ($http_authorization != "Bearer sk-or-expected") { return 401; }
        if ($http_x_openrouter_route != "") { return 400; }
        if ($http_content_length = "") { return 400; }
        default_type application/json;
        return 200 '{"model":"test/model","choices":[],"usage":{"cost":0}}';
    }
}
